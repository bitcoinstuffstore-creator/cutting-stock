<title>RollNest demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: donkere snijtafel-kop met kopcijfers en tabs, daaronder één werkscherm op een koel blauwgrijs vlak. */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --line: #cfd7df;
  --line-strong: #a9b5c1;
  --fg: #16202b;
  --muted: #566473;
  --accent: #c2470f;
  --accent-hover: #a63b0b;
  --accent-fg: #ffffff;
  --accent-soft: #fbe6da;
  --kop-bg: #18222d;
  --kop-fg: #eef2f6;
  --kop-muted: #9aa9b8;
  --kop-tile: #222e3b;
  --kop-line: #34424f;
  --kop-accent: #ff7a3d;
  --good: #1d6b45;
  --good-soft: #dcefe4;
  --bad: #a52a1f;
  --bad-soft: #f8e1de;
  --warn: #7a5300;
  --warn-soft: #f6ebcf;
  --focus: #1f6fd1;
  --schaduw: rgb(16 24 32 / 0.22);
  /* Doeken in het snijplan: 8 lichte vlakken met donkere tekst. */
  --stuk-0: #cfe1f3; --stuk-1: #f6d7c3; --stuk-2: #d2eadb; --stuk-3: #e6daf2;
  --stuk-4: #f3e5b3; --stuk-5: #cdeae8; --stuk-6: #f2d2dc; --stuk-7: #dbe2ea;
  --stuk-rand: #24303c;
  --baan-tint: #16202b;

  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --radius: 4px;
  --max: 1320px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d;
    --surface: #18212a;
    --surface-2: #1d2731;
    --line: #2c3a47;
    --line-strong: #435463;
    --fg: #e4eaf0;
    --muted: #93a3b3;
    --accent: #ff7a3d;
    --accent-hover: #ff9562;
    --accent-fg: #1a0d05;
    --accent-soft: #3a2216;
    --kop-bg: #0b1015;
    --kop-fg: #eef2f6;
    --kop-muted: #8b9aaa;
    --kop-tile: #151d25;
    --kop-line: #2a3642;
    --kop-accent: #ff7a3d;
    --good: #5cc48e;
    --good-soft: #17301f;
    --bad: #ff8a7d;
    --bad-soft: #3a1c19;
    --warn: #e7b850;
    --warn-soft: #33290f;
    --focus: #6aa8ff;
    --schaduw: rgb(0 0 0 / 0.55);
    --stuk-0: #24496b; --stuk-1: #6b3a1f; --stuk-2: #23553a; --stuk-3: #4b3566;
    --stuk-4: #5c4d16; --stuk-5: #1f5654; --stuk-6: #642c3c; --stuk-7: #3a4654;
    --stuk-rand: #c9d4df; --baan-tint: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d;
  --surface: #18212a;
  --surface-2: #1d2731;
  --line: #2c3a47;
  --line-strong: #435463;
  --fg: #e4eaf0;
  --muted: #93a3b3;
  --accent: #ff7a3d;
  --accent-hover: #ff9562;
  --accent-fg: #1a0d05;
  --accent-soft: #3a2216;
  --kop-bg: #0b1015;
  --kop-fg: #eef2f6;
  --kop-muted: #8b9aaa;
  --kop-tile: #151d25;
  --kop-line: #2a3642;
  --kop-accent: #ff7a3d;
  --good: #5cc48e;
  --good-soft: #17301f;
  --bad: #ff8a7d;
  --bad-soft: #3a1c19;
  --warn: #e7b850;
  --warn-soft: #33290f;
  --focus: #6aa8ff;
  --schaduw: rgb(0 0 0 / 0.55);
  --stuk-0: #24496b; --stuk-1: #6b3a1f; --stuk-2: #23553a; --stuk-3: #4b3566;
  --stuk-4: #5c4d16; --stuk-5: #1f5654; --stuk-6: #642c3c; --stuk-7: #3a4654;
  --stuk-rand: #c9d4df; --baan-tint: #ffffff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--kop-bg);
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.binnen {
  max-width: var(--max);
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Kop ---------- */
.kop { background: var(--kop-bg); color: var(--kop-fg); }
.kop .binnen { padding-block: 14px 0; display: grid; gap: 14px; }
.kop-rij { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; justify-content: space-between; }
.merk { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: 0.01em; }
.logo b { color: var(--kop-accent); font-weight: 700; }
.merk-sub { color: var(--kop-muted); font-size: 0.85rem; }
.kop-acties { display: flex; gap: 8px; align-items: center; }
.knop-kop {
  font: 500 0.8rem var(--font-body);
  color: var(--kop-fg);
  background: transparent;
  border: 1px solid var(--kop-line);
  border-radius: var(--radius);
  padding: 5px 10px;
  cursor: pointer;
}
.knop-kop:hover { border-color: var(--kop-muted); }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi {
  background: var(--kop-tile);
  border: 1px solid var(--kop-line);
  border-radius: var(--radius);
  padding: 10px 14px 12px;
  min-width: 0;
  display: grid;
  gap: 2px;
  align-content: start;
  transition: opacity 0.15s;
}
.kpis[aria-busy="true"] .kpi { opacity: 0.7; }
.kpi-label { font-family: var(--font-display); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--kop-muted); }
.kpi-waarde { font-family: var(--font-mono); font-size: 1.65rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: anywhere; }
.kpi-sub { font-size: 0.82rem; color: var(--kop-muted); }
.kpi-tag {
  display: inline-block;
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 2px;
  border: 1px solid currentColor;
  vertical-align: middle;
}
.kpi-tag[data-soort="te-weinig"], .kpi-tag[data-soort="te-veel"] { color: var(--kop-accent); }
.kpi-tag[data-soort="gelijk"] { color: var(--kop-muted); }

.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab {
  font: 600 0.95rem var(--font-display);
  letter-spacing: 0.02em;
  color: var(--kop-muted);
  background: transparent;
  border: 0;
  border-bottom: 3px solid transparent;
  padding: 10px 14px 9px;
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: var(--kop-fg); }
.tab[aria-selected="true"] { color: var(--kop-fg); border-bottom-color: var(--kop-accent); }

/* Meetlint: 1 streepje per cm, langer per 5 en 10. */
.meetlint {
  height: 9px;
  background:
    repeating-linear-gradient(90deg, var(--kop-muted) 0 1px, transparent 1px 50px) bottom left / 100% 9px no-repeat,
    repeating-linear-gradient(90deg, var(--kop-line) 0 1px, transparent 1px 25px) bottom left / 100% 6px no-repeat,
    repeating-linear-gradient(90deg, var(--kop-line) 0 1px, transparent 1px 5px) bottom left / 100% 3px no-repeat;
  background-color: var(--kop-bg);
  opacity: 0.9;
}

@media (min-width: 900px) and (min-height: 900px) {
  .kop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
}

/* ---------- Werkscherm ---------- */
main .binnen { padding-block: 20px 32px; display: grid; gap: 18px; }
.scherm-kop { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.scherm-kop p { color: var(--muted); max-width: 70ch; }
.werkbalk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.paneel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: grid;
  gap: 12px;
  min-width: 0;
  align-content: start;
}
.paneel-kop { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; }
.paneel-kop .tel { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.uitleg { color: var(--muted); font-size: 0.88rem; max-width: 68ch; }

.knop {
  font: 500 0.9rem var(--font-body);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.knop:hover { background: var(--surface-2); }
.knop-hoofd { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.knop-hoofd:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.knop-gevaar { color: var(--bad); border-color: var(--bad); }
.knop-gevaar:hover { background: var(--bad-soft); }
.knop-klein { padding: 3px 9px; font-size: 0.82rem; }
.knop:disabled { opacity: 0.5; cursor: not-allowed; }
.bevestig { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 3px 3px 3px 10px; background: var(--bad-soft); border-radius: var(--radius); }
.bevestig span { color: var(--bad); font-weight: 600; font-size: 0.88rem; }

.schakel { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.schakel button {
  font: 500 0.9rem var(--font-body);
  color: var(--muted);
  background: transparent;
  border: 0;
  padding: 6px 14px;
  cursor: pointer;
}
.schakel button + button { border-left: 1px solid var(--line-strong); }
.schakel button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.schakel .aantal { font-family: var(--font-mono); font-size: 0.8rem; opacity: 0.8; margin-left: 4px; }

/* ---------- Tabellen ---------- */
.tabel-scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface-2);
  padding: 7px 8px;
  white-space: normal;
  vertical-align: bottom;
  position: sticky;
  top: 0;
}
td.tekst, td.waarde { padding: 6px 8px; }
th.num, td.num, td.waarde { text-align: right; }
td.waarde, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
tfoot td { padding: 7px 8px; font-weight: 600; border-top: 1px solid var(--line-strong); border-bottom: 0; }
tr.heeft-fout td:first-child { box-shadow: inset 3px 0 0 var(--warn); }

.cel {
  width: 100%;
  min-width: 0;
  font: inherit;
  color: var(--fg);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  padding: 5px 7px;
}
.cel:hover { border-color: var(--line); }
.cel:focus { background: var(--surface); border-color: var(--focus); outline: none; box-shadow: 0 0 0 1px var(--focus); }
.cel.num { text-align: right; }
.cel[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-soft); }
select.cel { padding-right: 2px; }
.cel::placeholder { color: var(--muted); opacity: 0.8; }
.w-xs { width: 64px; } .w-s { width: 84px; } .w-m { width: 112px; } .w-l { width: 150px; } .w-xl { width: 220px; }
td.vink { text-align: center; }
td.vink input { width: 17px; height: 17px; accent-color: var(--accent); margin: 6px; }
.del {
  font: 600 1rem/1 var(--font-body);
  color: var(--muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 2px;
  width: 30px;
  height: 30px;
  cursor: pointer;
}
.del:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.meer { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 0.88rem; }

/* ---------- Orders ---------- */
.orders-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) { .orders-grid { grid-template-columns: minmax(0, 1fr) 340px; } }
.zijkant { display: grid; gap: 18px; min-width: 0; }
textarea {
  width: 100%;
  font: 0.85rem/1.45 var(--font-mono);
  color: var(--fg);
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 8px 10px;
  resize: vertical;
}
input[type="file"] { font: 0.85rem var(--font-body); color: var(--muted); max-width: 100%; }
input[type="file"]::file-selector-button {
  font: 500 0.85rem var(--font-body);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  padding: 5px 10px;
  margin-right: 10px;
  cursor: pointer;
}
.veld-label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px; }
.import-status { font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.import-status b { font-family: var(--font-mono); font-weight: 500; }
.foutlijst { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 0.85rem; }
.foutlijst:empty { display: none; }
.foutlijst li { padding: 5px 8px; border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 2px 2px 0; overflow-wrap: anywhere; }
.foutlijst li.waarschuwing { border-left-color: var(--warn); background: var(--warn-soft); }
.bron {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0 5px;
  margin-right: 6px;
  border: 1px solid currentColor;
  border-radius: 2px;
  color: var(--muted);
}
details.meldingen { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--radius); padding: 8px 12px; }
details.meldingen summary { cursor: pointer; font-weight: 600; color: var(--warn); }
details.meldingen .foutlijst { margin-top: 8px; }
.ok-regel { font-size: 0.88rem; color: var(--good); display: flex; gap: 6px; align-items: center; }
.ok-regel::before { content: "✓"; font-weight: 700; }
.voorbeeld-tabel table { font-size: 0.8rem; }

/* ---------- Stoffen & regels ---------- */
.stoffen-boven { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1000px) { .stoffen-boven { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } }
.instellingen { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 14px 16px; }
.veld { display: grid; gap: 3px; align-content: start; min-width: 0; }
.veld label { font-size: 0.85rem; font-weight: 600; }
.veld .invoer-eenheid { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); }
.veld .invoer-eenheid:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.veld input, .veld select {
  font: 0.95rem var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--fg);
  background: transparent;
  border: 0;
  padding: 6px 8px;
  width: 100%;
  min-width: 0;
}
.veld input:focus, .veld select:focus { outline: none; }
.veld select { font-family: var(--font-body); }
.eenheid { padding: 0 9px; color: var(--muted); font-size: 0.85rem; border-left: 1px solid var(--line); white-space: nowrap; }
.veld small { color: var(--muted); font-size: 0.8rem; line-height: 1.35; }
.bron-tag { font-size: 0.75rem; color: var(--muted); font-family: var(--font-body); }

/* ---------- Voet, meldingen ---------- */
.voet { border-top: 1px solid var(--line); background: var(--surface); }
.voet .binnen { padding-block: 18px 24px; display: grid; gap: 14px; }
.voet-rij { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
.privacy { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.privacy::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--good); flex: none; }
.kopieer-status { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
.fout-tekst { color: var(--bad); font-size: 0.88rem; font-weight: 500; }
.fout-tekst:empty { display: none; }

.toast {
  position: fixed;
  z-index: 20;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  margin: 0 auto;
  max-width: 520px;
  background: var(--fg);
  color: var(--surface);
  border-radius: var(--radius);
  padding: 10px 14px;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 6px 24px var(--schaduw);
  font-size: 0.9rem;
}
.toast button { font: 600 0.85rem var(--font-body); color: var(--surface); background: transparent; border: 1px solid currentColor; border-radius: var(--radius); padding: 3px 9px; cursor: pointer; white-space: nowrap; }

.leeg-staat { padding: 28px 16px; text-align: center; color: var(--muted); }

/* ---------- Resultaat ---------- */
#scherm { grid-template-columns: minmax(0, 1fr); }
.schakel.subtabs { max-width: 100%; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
.schakel.subtabs button { white-space: nowrap; }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.82rem; color: var(--muted); }
.legenda-item { display: inline-flex; align-items: center; gap: 6px; }
.staal { display: inline-block; width: 18px; height: 6px; border-radius: 1px; }
.staal-berekend, .balk-berekend { background: var(--accent); }
.staal-gevoel, .balk-gevoel { background: var(--line-strong); }
.vergelijk { width: 140px; display: grid; gap: 3px; padding: 2px 0; }
/* Inkooptabel heeft 12 kolommen: iets compacter zodat hij op een laptopscherm past. */
#tabel-inkoop th, #tabel-inkoop td.tekst, #tabel-inkoop td.waarde { padding-left: 5px; padding-right: 5px; }
#tabel-inkoop .vergelijk { width: 88px; }
.balk { display: block; height: 6px; border-radius: 1px; min-width: 1px; }
.merk-tag {
  display: inline-block;
  font: 600 0.7rem var(--font-body);
  letter-spacing: 0.02em;
  color: var(--muted);
  border: 1px solid currentColor;
  border-radius: 2px;
  padding: 0 4px;
  margin-left: 4px;
  vertical-align: 1px;
}
.verschil-tag {
  display: inline-block;
  font: 600 0.72rem var(--font-body);
  border: 1px solid currentColor;
  border-radius: 2px;
  padding: 0 5px;
  margin-left: 4px;
  vertical-align: 1px;
}
/* Elke afwijking kost geld (overschot of tekort): beide als waarschuwing, met tekstlabel. */
td.verschil[data-soort="te-weinig"], td.verschil[data-soort="te-veel"] { color: var(--warn); }
td.verschil[data-soort="te-weinig"] .verschil-tag, td.verschil[data-soort="te-veel"] .verschil-tag { background: var(--warn-soft); }
td.verschil[data-soort="gelijk"] { color: var(--muted); }
